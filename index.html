<!DOCTYPE html>
<html>
<head>
    <title>Digihumanitaaria projekt</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f0f9ff);
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1e3a8a;
            color: white;
            padding: 40px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 50px auto;
            max-width: 900px;
        }

        .card {
            background-color: white;
            width: 300px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .button {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
        }

        .button:hover {
            background-color: #1d4ed8;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background-color: #1e3a8a;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Digihumanitaaria projekt</h1>
    <p>Veebilehtede loomise katsetus</p>
</header>

<h2> Sisukord</h2>

<div class="container">

    <div class="card">
        <h2>Leht 1</h2>
        <p>Ülevaade sündmusest ja selle põhiteemadest.</p>
        <a class="button" href="leht1.html">Ava leht 1</a>
    </div>

    <div class="card">
        <h2>Leht 2</h2>
        <p>Sündmuse detailsem kirjeldus ja ajakava.</p>
        <a class="button" href="leht2.html">Ava leht 2</a>
    </div>

</div>

<footer>
    <p>Koostatud digihumanitaaria kursuse raames</p>
</footer>

</body>
</html>
