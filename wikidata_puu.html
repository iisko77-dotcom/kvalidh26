<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>2010–2015 ilmunud videomängude klõpsatav puu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      background: #f4f6f8;
      color: #222;
    }

    h1 {
      color: #253858;
    }

    .tree-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }

    ul {
      list-style: none;
      padding-left: 25px;
    }

    li {
      margin: 9px 0;
    }

    .toggle {
      border: none;
      background: #e8eef7;
      color: #253858;
      border-radius: 5px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }

    .toggle:hover {
      background: #d5e2f5;
    }

    .children {
      border-left: 2px solid #d5dce8;
      margin-left: 10px;
    }

    .hidden {
      display: none;
    }

    .game {
      padding: 5px 10px;
      display: inline-block;
    }

    .status {
      color: #555;
      font-size: 14px;
    }

    a {
      color: #245bb5;
    }
  </style>
</head>

<body>
  <h1>2010–2015 ilmunud videomängude klõpsatav puu</h1>

  <p>
    Puu rühmitab kuni 100 aastatel 2010–2015
    ilmunud videomängu arendajate järgi.
    Klõpsa arendaja nimel, et avada temaga
    seotud mängud.
  </p>

  <div class="tree-box">
    <p id="status" class="status">
      Laadin Wikidata andmeid...
    </p>

    <div id="tree"></div>
  </div>

  <p>
    Andmeallikas:
    <a href="https://query.wikidata.org/"
       target="_blank" rel="noopener noreferrer">
      Wikidata Query Service
    </a>
  </p>

<script>
const query = `
  SELECT ?game ?gameLabel ?date
         ?developer ?developerLabel
  WHERE {
    {
      SELECT ?game ?date WHERE {
        ?game wdt:P31/wdt:P279* wd:Q7889;
              wdt:P577 ?date.

        FILTER(
          ?date >= "2010-01-01T00:00:00Z"^^xsd:dateTime &&
          ?date < "2016-01-01T00:00:00Z"^^xsd:dateTime
        )
      }
      GROUP BY ?game ?date
      ORDER BY ?date
      LIMIT 100
    }

    ?game wdt:P178 ?developer.

    SERVICE wikibase:label {
      bd:serviceParam wikibase:language "et,en".
    }
  }

  ORDER BY ?developerLabel ?gameLabel
`;

async function loadTree() {
  const status = document.getElementById("status");
  const tree = document.getElementById("tree");

  try {
    const url =
      "https://query.wikidata.org/sparql?query=" +
      encodeURIComponent(query);

    const response = await fetch(url, {
      headers: {
        "Accept": "application/sparql-results+json"
      }
    });

    if (!response.ok) {
      throw new Error(
        "Wikidata vastas veaga HTTP " + response.status
      );
    }

    const json = await response.json();
    const rows = json.results.bindings;

    // Võtame Q-koodi ainult varuvariandina,
    // kui Wikidatas puudub arusaadav nimi.
    function getId(uri) {
      return uri ? uri.split("/").pop() : "Tundmatu";
    }

    const developers = new Map();

    rows.forEach(row => {
      const developerId = row.developer.value;

      const developerName =
        row.developerLabel?.value ||
        getId(developerId);

      if (!developers.has(developerId)) {
        developers.set(developerId, {
          name: developerName,
          url: developerId,
          games: new Map()
        });
      }

      const gameId = row.game.value;

      const gameName =
        row.gameLabel?.value ||
        getId(gameId);

      developers.get(developerId).games.set(gameId, {
        name: gameName,
        url: gameId
      });
    });

    if (rows.length === 0) {
      status.textContent =
        "Selle perioodi kohta ei leitud arendaja-seosega mänge.";
      return;
    }

    const root = document.createElement("ul");

    // Sorteerime arendajad tähestikulises järjekorras.
    [...developers.entries()]
      .sort((a, b) =>
        a[1].name.localeCompare(b[1].name)
      )
      .forEach(([developerId, dev]) => {
        const item = document.createElement("li");

        const button = document.createElement("button");
        button.className = "toggle";

        button.textContent =
          `▶ ${dev.name} (${dev.games.size})`;

        const childList = document.createElement("ul");
        childList.className = "children hidden";

        // Lisame arendaja alla tema mängud.
        [...dev.games.values()]
          .sort((a, b) =>
            a.name.localeCompare(b.name)
          )
          .forEach(game => {
            const gameItem = document.createElement("li");
            const link = document.createElement("a");

            link.href = game.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = game.name;
            link.className = "game";

            gameItem.appendChild(link);
            childList.appendChild(gameItem);
          });

        // Klõps muudab puuosa avatuks või suletuks.
        button.addEventListener("click", () => {
          const closed =
            childList.classList.toggle("hidden");

          button.textContent =
            `${closed ? "▶" : "▼"} ${dev.name} (${dev.games.size})`;
        });

        item.appendChild(button);
        item.appendChild(childList);
        root.appendChild(item);
      });

    tree.replaceChildren(root);

    status.textContent =
      "Periood: 2010–2015. " +
      "Valimis kuni 100 mängu; leiti " +
      developers.size + " arendajat ja " +
      rows.length + " mängu-arendaja seost. " +
      "Klõpsa arendaja nimel.";

  } catch (error) {
    console.error(error);

    status.textContent =
      "Andmete laadimine ebaõnnestus. " +
      "Proovi uuesti laadida ja kontrolli vajadusel " +
      "F12 → Console.";
  }
}

loadTree();
</script>

</body>
</html>
