<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Eesti jäähokimängijad ja sünnikuupäevad</title>

    <script>
      function kysi() {
        const vastus = document.getElementById("vastus");

        let lause = `
          SELECT DISTINCT ?item ?itemLabel ?synniaeg
          WHERE {
            ?item wdt:P27 wd:Q191.
            ?item wdt:P106 wd:Q11774891.
            ?item wdt:P641 wd:Q41466.

            OPTIONAL {
              ?item wdt:P569 ?synniaeg.
            }

            SERVICE wikibase:label {
              bd:serviceParam wikibase:language "et,en".
            }
          }
          LIMIT 50
        `;

        let aadress =
          "https://query.wikidata.org/sparql?format=json&query=" +
          encodeURIComponent(lause);

        vastus.textContent = "Ootan vastust...";

        fetch(aadress)
          .then(d => {
            if (!d.ok) throw new Error("HTTP " + d.status);
            return d.json();
          })
          .then(d => kuva(d))
          .catch(error => {
            vastus.textContent = "Päringu tegemisel tekkis viga.";
            console.log(error);
          });
      }

      function kuva(d) {
        const vastus = document.getElementById("vastus");
        vastus.innerHTML = "";

        for (let rida of d.results.bindings) {
          let element = document.createElement("li");
          let synniaeg = rida.synniaeg
            ? rida.synniaeg.value.substring(0, 10)
            : "sünnikuupäev puudub";

          element.textContent =
            rida.itemLabel.value + " – " + synniaeg;

          vastus.appendChild(element);
        }

        if (d.results.bindings.length === 0) {
          vastus.textContent = "Tulemusi ei leitud.";
        }
      }
    </script>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
      }
      h1 {
        color: #183b56;
        border-bottom: 2px solid #183b56;
        padding-bottom: 10px;
      }
      button {
        padding: 8px 12px;
        cursor: pointer;
      }
      li { margin-bottom: 6px; }
    </style>
  </head>

  <body>
    <h1>Eesti jäähokimängijad ja sünnikuupäevad</h1>

    <p>
      See päring otsib Wikidatast Eesti kodakondsusega
      jäähokimängijaid. Lisaks nimedele kuvatakse
      sünnikuupäevad, kui need on andmebaasis olemas.
    </p>

    <button onclick="kysi()">Otsi mängijaid</button>

    <h2>Otsingu tulemused</h2>
    <ul id="vastus"></ul>
  </body>
</html>
